<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <!--
      GitHub Pages serves this file for any path it doesn't recognise as a
      real file (e.g. a direct visit/refresh on /admin). Since this is a
      single-page app, we redirect back to the real index.html and encode
      the originally-requested path in the query string so it can be
      restored client-side (see the inline script in index.html).
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1; // 1 for a GitHub Pages *project* site (username.github.io/repo-name/...)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
